# Full local stack: PostgreSQL -> API -> Next.js, behind Nginx.
# Only Nginx is published. PostgreSQL and the API stay on the internal network.
#
#   docker compose up -d --build          # start (migrations run automatically)
#   docker compose run --rm seed          # load demo data (manual, never automatic)

name: qurylys

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgres://${POSTGRES_USER:-qurylys}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-qurylys}?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qurylys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-qurylys}
      # Built-in C.UTF-8 provider: Unicode-correct ILIKE/lower() for Kazakh and
      # Russian, independent of the container's libc.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    image: qurylys-backend:local
    command: ["migrate", "up"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    image: qurylys-backend:local
    command: ["seed"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]
    restart: "no"

  api:
    image: qurylys-backend:local
    restart: unless-stopped
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"
      # Same origin through Nginx: no CORS needed.
      CORS_ALLOWED_ORIGINS: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 20s

  web:
    build:
      context: ./frontend
      args:
        # Browser calls go to the same domain; Nginx routes /api/ to the API.
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    image: qurylys-web:local
    restart: unless-stopped
    environment:
      # Server-side rendering calls the API directly on the internal network.
      API_INTERNAL_URL: http://api:8080/api/v1
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      # 127.0.0.1 by default; set HTTP_BIND=0.0.0.0 to expose on the network.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
